aid: chegg
name: Chegg
description: 'Chegg is an American education technology company that provides direct-to-student
  learning services, including 24/7 homework and expert Q&A help, step-by-step textbook
  solutions, practice questions, and writing, grammar, and citation tools. Founded
  in 2005 and headquartered in Santa Clara, California, Chegg began as a textbook-rental
  marketplace and expanded into a subscription study-support platform (Chegg Study,
  Chegg Writing, Chegg Math Solver) plus tutoring and skills offerings. Chegg operates
  as a consumer web/mobile product rather than a developer platform: it exposes no
  public developer portal, published API, or SDKs at this time. Its public technical
  surface is limited to a coordinated vulnerability disclosure program on HackerOne
  and standard web security/policy pages. Surfaced as a portfolio company of Kleiner
  Perkins and enriched by the API Evangelist pipeline.'
